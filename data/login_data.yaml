# 登录测试数据
# smoke：true 表示用例属于冒烟套件
- case_id: "001"
  title: "正确输入基本项，正常登录"
  username: "testuser"
  password: "Test@123456"
  expect_code: 200
  smoke: true
  id: "001-正常登录"

- case_id: "002"
  title: "绕过前端：账号为空后端必须拦截"
  username: ""
  password: "Test@123456"
  expect_code: 500
  id: "002-空账号后端拦截"

- case_id: "004"
  title: "用户不存在，不能登录"
  username: "no_such_user_999"
  password: "Test@123456"
  expect_code: 500
  id: "004-用户不存在"

- case_id: "005"
  title: "密码错误，不能登录"
  username: "testuser"
  password: "wrong_pwd_123"
  expect_code: 500
  smoke: true
  id: "005-密码错误"